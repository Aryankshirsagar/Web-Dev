<head>

    <style>
        #box{
            height: 700px;

            background-color: dimgrey;
            border-radius: 50%;

         }
         #yash{
            height: 700px;
            width: 100px;
            background-color: crimson;
            transition: 3s;
         }
        
         #yash:hover{
            background-color: dimgrey;
            border-radius: 50%;
            background-image: linear-gradient(70deg,Blue,purple, deeppink,red,orange);
         }
         </style>
</head>

</div>
